<!DOCTYPE HTML>
<html lang="en">
<head>
<title>Project Library | Daniel Im</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<meta name="description" content="Complete project library: governance systems, data infrastructure builds, and CRM automations built for revenue operations teams." />
<meta property="og:title" content="Daniel Im | Project Library" />
<meta property="og:description" content="11 Sales Operations projects covering Salesforce automation, CRM governance, data infrastructure, and workflow design." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://danielim.co/projects-library.html" />
<meta property="og:image" content="https://danielim.co/og-image.png" />
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon%2016x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon%2032x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="images/favicon%2048x48.png">
<link rel="icon" type="image/png" sizes="96x96" href="images/favicon%2096x96.png">
<link rel="stylesheet" href="assets/css/sf-theme.css">

<style>

/* PAGE HEADER */

.sf-page-header {
  background: white;
  border: 1px solid #dddbda;
  border-radius: 4px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.06);
  padding: 16px 24px;
  margin-bottom: 16px;
}

.sf-page-title {
  font-size: 1.8rem;
  font-weight: 700;
  color: #16325c;
  line-height: 1.15;
}

.sf-rh-fields {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 32px;
  align-items: flex-start;
}

.sf-hl-label {
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: #706e6b;
  margin-bottom: 3px;
  white-space: nowrap;
}

.sf-hl-value {
  font-size: 0.8rem;
  color: #181818;
  font-weight: 500;
}

.sf-rh-name-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.sf-proj-header-icon {
  width: 44px;
  height: 44px;
  background: #e287b2;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* TABS */

.library-tabs {
  background: white;
  border: 1px solid #dddbda;
  border-radius: 4px 4px 0 0;
  border-bottom: none;
  display: flex;
  margin-bottom: 0;
}

.cat-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  font-size: 0.88rem;
  font-weight: 600;
  color: #706e6b;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: all 0.15s;
  line-height: 1;
}
.cat-btn:hover { color: #181818; background: #f8f8f8; }
.cat-btn.active {
  color: #0176d3;
  border-bottom-color: #0176d3;
}

.cat-count {
  font-size: 0.65rem;
  font-weight: 700;
  background: #e5e4e2;
  color: #706e6b;
  border-radius: 20px;
  padding: 2px 7px;
}
.cat-btn.active .cat-count {
  background: #c9e5f8;
  color: #0176d3;
}

/* RIGHT PANEL */

.library-preview {
  background: white;
  border: 1px solid #dddbda;
  border-top: 1px solid #e5e4e2;
  border-radius: 0 0 4px 4px;
  padding: 20px;
}

/* PROJECT CARDS */

.proj-card {
  border: 1px solid #dddbda;
  border-radius: 4px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: white;
  box-shadow: 0 2px 5px rgba(0,0,0,0.06);
  transition: box-shadow 0.2s ease;
}
.proj-card:hover { box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
.proj-card:hover .proj-card-thumb img { transform: scale(1.05); }
.proj-card-thumb img { transition: transform 0.3s ease; }

.proj-card-thumb {
  height: 190px;
  overflow: hidden;
  border-bottom: 1px solid #e5e4e2;
  flex-shrink: 0;
}
.proj-card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}
.proj-card-thumb-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.proj-card-body {
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.proj-card-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: #16325c;
  line-height: 1.35;
}

.proj-card-desc {
  font-size: 0.84rem;
  color: #706e6b;
  line-height: 1.65;
  flex: 1;
  margin: 0;
}

/* RESPONSIVE */

@media (max-width: 768px) {
  .library-tabs { overflow-x: auto; }
  .cat-btn { padding: 10px 14px; font-size: 0.82rem; }
}

</style>
</head>

<body>

<div id="sf-nav-placeholder"></div>

<!-- CONTEXT BAR -->
<div class="sf-context-bar">
  <div class="sf-object-chip">
    <div class="sf-object-icon-box projects">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <rect x="1" y="1" width="4" height="4" rx="0.5" fill="white"/>
        <rect x="7" y="1" width="4" height="4" rx="0.5" fill="white"/>
        <rect x="1" y="7" width="4" height="4" rx="0.5" fill="white"/>
        <rect x="7" y="7" width="4" height="4" rx="0.5" fill="white"/>
      </svg>
    </div>
    <div class="sf-breadcrumb">
      <a href="/index.html" class="sf-breadcrumb-link">Daniel Im</a>
      <span class="sf-breadcrumb-sep">›</span>
      <span class="sf-breadcrumb-current">Projects</span>
    </div>
  </div>
</div>

<!-- PAGE -->
<div class="sf-page">
<div class="sf-container">

  <!-- PAGE HEADER -->
  <div class="sf-page-header">
    <div class="sf-rh-name-row">
      <div class="sf-proj-header-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="7" height="7" rx="1" fill="white"/>
          <rect x="14" y="3" width="7" height="7" rx="1" fill="white"/>
          <rect x="3" y="14" width="7" height="7" rx="1" fill="white"/>
          <rect x="14" y="14" width="7" height="7" rx="1" fill="white"/>
        </svg>
      </div>
      <div class="sf-page-title">Project Library</div>
    </div>
  </div>

  <!-- TABS -->
  <div class="library-tabs">
    <button class="cat-btn active" data-cat="crm">CRM &amp; Automation <span class="cat-count">2</span></button>
    <button class="cat-btn" data-cat="governance">Governance Systems <span class="cat-count">3</span></button>
    <button class="cat-btn" data-cat="data">Data Infrastructure <span class="cat-count">4</span></button>
  </div>

  <!-- CARD PANEL -->
  <div class="library-preview">
    <div id="proj-grid" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;"></div>
  </div>

</div>
</div>


<script>

var categories = {
  crm: ['expireddigest', 'demoemail'],
  governance: ['allocation', 'pip', 'roe'],
  data: ['enrichment', 'fte', 'dedup', 'tldashboard']
};

var projectData = {

  expireddigest: {
    title: 'Expired Lead Follow-Up Automation',
    category: 'CRM & Automation',
    categoryClass: 'sf-tag-automation',
    image: 'images/expired-lead-digest.jpg',
    link: 'projects/expired-lead-digest.html',
    summary: 'Built a native Salesforce system that captures lead expiration events and delivers a personalized weekly digest to each rep, turning silent ownership losses into an active re-engagement channel.'
  },

  demoemail: {
    title: 'Salesforce Demo Email Capture Workflow',
    category: 'CRM & Automation',
    categoryClass: 'sf-tag-automation',
    image: 'images/demo-email-flow.webp',
    link: 'projects/demo-email.html',
    summary: 'Built a Record-Triggered Flow that automatically copies contact email data to Opportunity records at the moment of demo booking, eliminating enrollment failures in marketing automation.'
  },

  allocation: {
    title: 'Account Ownership & Cross-Sell Rules',
    category: 'Governance Systems',
    categoryClass: 'sf-tag-governance',
    image: 'images/account-ownership-thumbnail.png',
    link: 'projects/allocation-TL.html',
    summary: 'Designed account routing logic and ownership rules that eliminated duplicate outreach across shared institutional accounts and improved cross-sell coordination across product lines.'
  },

  pip: {
    title: 'Quota-Based Performance Governance Framework',
    category: 'Governance Systems',
    categoryClass: 'sf-tag-governance',
    image: 'images/pip-governance.png',
    link: 'projects/pip-governance.html',
    summary: 'Built a structured performance intervention system with measurable trigger criteria, standardized timelines, and documentation templates that made the review process objective and repeatable.'
  },

  roe: {
    title: 'CRM Outreach Eligibility Reporting',
    category: 'Governance Systems',
    categoryClass: 'sf-tag-governance',
    image: 'images/roe-lead-ownership.png',
    link: 'projects/roe-compliance-reporting.html',
    summary: 'Designed an account qualification framework with opportunity conflict analysis and escalation paths that reduced SDR and AE outreach collisions across shared accounts.'
  },

  enrichment: {
    title: '9,000-Account CRM Enrichment',
    category: 'Data Infrastructure',
    categoryClass: 'sf-tag-data',
    image: 'images/enrichment-sheet.webp',
    link: 'projects/enrichment.html',
    summary: 'Audited and enriched 9,000 Salesforce accounts to restore segmentation accuracy, establishing clean data foundations that improved targeting and pipeline reporting across the team.'
  },

  fte: {
    title: 'Account Data Lookup Tool',
    category: 'Data Infrastructure',
    categoryClass: 'sf-tag-data',
    image: 'images/fte-lookup-component.webp',
    link: 'projects/fte-lookup.html',
    summary: 'Built a Google Sheets tool that reduced SDR enrollment lookup time from 30 seconds to 3 seconds, eliminating a daily friction point and freeing up prospecting capacity across the team.'
  },

  dedup: {
    title: 'Salesforce Account Deduplication & Ownership Cleanup',
    category: 'Data Infrastructure',
    categoryClass: 'sf-tag-data',
    image: 'images/dedupe-thumbnail.png',
    link: 'projects/account-dedup.html',
    summary: 'Resolved duplicate Salesforce Account records through name normalization, confidence-level grouping, and a structured merge decision framework, then created CRM governance standards to prevent future duplication.'
  },

  tldashboard: {
    title: 'Team Lead Performance Dashboard',
    category: 'Data Infrastructure',
    categoryClass: 'sf-tag-data',
    image: 'images/team-lead-dashboard.png',
    link: 'projects/team-lead-dashboard.html',
    summary: 'Built a consolidated Salesforce dashboard giving team leads a single source of truth on rep pipeline activity and quota attainment each quarter, rolling up demos held, lost demos, and upcoming pipeline against quota.'
  },

};

function placeholderIcon(color) {
  return '<svg width="40" height="40" viewBox="0 0 40 40" fill="none">' +
    '<rect x="6" y="6" width="28" height="28" rx="3" stroke="' + color + '" stroke-width="1.8" fill="none"/>' +
    '<path d="M12 20h16M12 14h10M12 26h7" stroke="' + color + '" stroke-width="1.8" stroke-linecap="round"/>' +
    '</svg>';
}

function renderCards(catKey) {
  var keys = categories[catKey];
  var grid = document.getElementById('proj-grid');
  grid.innerHTML = keys.map(function(key) {
    var d = projectData[key];
    var thumbInner = d.image
      ? '<img src="' + d.image + '" alt="' + d.title + '">'
      : '<div class="proj-card-thumb-placeholder" style="background:' + d.placeholderBg + ';">' + placeholderIcon(d.placeholderColor) + '</div>';
    var thumb = '<a href="' + d.link + '" style="display:block; height:100%; transition:opacity 0.15s;" onmouseover="this.style.opacity=0.85" onmouseout="this.style.opacity=1">' + thumbInner + '</a>';
    return '<div class="proj-card">' +
      '<div class="proj-card-thumb">' + thumb + '</div>' +
      '<div class="proj-card-body">' +
        '<a href="' + d.link + '" class="proj-card-title" style="text-decoration:none; color:#16325c;">' + d.title + '</a>' +
        '<p class="proj-card-desc">' + d.summary + '</p>' +
        '<a href="' + d.link + '" class="sf-btn sf-btn-secondary" style="align-self:flex-start; margin-top:4px;">View Project →</a>' +
      '</div>' +
    '</div>';
  }).join('');
}

document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.cat-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      renderCards(this.getAttribute('data-cat'));
    });
  });
  renderCards('crm');
});

</script>

<script>
fetch("components/sf-nav.html")
.then(function(r){return r.text();})
.then(function(d){
  var el=document.getElementById("sf-nav-placeholder");
  el.innerHTML=d;
  el.querySelectorAll("script").forEach(function(s){var n=document.createElement("script");n.textContent=s.textContent;document.head.appendChild(n);});
});
</script>

</body>
</html>
