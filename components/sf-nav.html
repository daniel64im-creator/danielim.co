<script>
(function() {
  var path = window.location.pathname;
  var inProjects = path.indexOf('/projects/') !== -1;
  document.querySelectorAll('#sf-desktop-nav a, #sf-mobile-nav a').forEach(function(a) {
    var href = a.getAttribute('href');
    var match = path.endsWith(href) || (path === '/' && href === '/index.html');
    var projMatch = inProjects && href === '/projects-library.html';
    if (match || projMatch) a.classList.add('active');
  });
  var hamburger = document.getElementById('sf-hamburger');
  var mobileNav = document.getElementById('sf-mobile-nav');
  if (hamburger && mobileNav) {
    hamburger.addEventListener('click', function() {
      var open = mobileNav.classList.toggle('open');
      this.setAttribute('aria-expanded', String(open));
    });
    mobileNav.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        mobileNav.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
      });
    });
  }

  document.addEventListener('click', function(e) {
    var link = e.target.closest && e.target.closest('a[href^="mailto:"]');
    if (link && typeof gtag === 'function') {
      gtag('event', 'email_click', { link_url: link.getAttribute('href') });
    }
  });
})();
</script>
